<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creador de Cartas de Amor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #230914 0%, #0a0206 100%);
      --env-base: #e599a4;
      --env-base-light: #f0b2bc;
      --env-base-dark: #d4828f;
      --paper-color: #fffdf9;
      --text-dark: #3f0c1f;
      --text-muted: #801f3f;
      --font-heading: 'Playfair Display', serif;
      --font-body: 'Outfit', sans-serif;
      --gold-foil: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fffdf5;
      overflow-x: hidden;
      position: relative;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 500px;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      z-index: 5;
      position: relative;
      border: 1px solid rgba(229, 153, 164, 0.25);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(229, 153, 164, 0.15);
      border-radius: 15px;
      pointer-events: none;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 28px;
      text-align: center;
      margin-bottom: 25px;
      color: var(--env-base-light);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: var(--env-base-light);
      letter-spacing: 0.5px;
    }

    input, textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      padding: 12px 16px;
      border-radius: 10px;
      color: #fff;
      font-family: var(--font-body);
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--env-base);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 10px rgba(229, 153, 164, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--env-base-dark);
      border: none;
      border-radius: 30px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 153, 164, 0.3);
      font-family: var(--font-body);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--env-base);
      box-shadow: 0 6px 20px rgba(229, 153, 164, 0.45);
      transform: translateY(-2px);
    }

    .btn:disabled {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .results {
      margin-top: 30px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: none;
    }

    .results.active {
      display: block;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--env-base-light);
      margin-bottom: 10px;
    }

    .link-container {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 15px;
    }

    .link-input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 14px;
      color: #ffd6e0;
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .link-input:focus {
      outline: none;
      box-shadow: none;
      background: transparent;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 0 15px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--env-base-dark);
      color: white;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .toast.active {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Creador de Cartas de Amor</h1>
    
    <div class="form-group">
      <label for="para-input">Para (Destinatario):</label>
      <input type="text" id="para-input" placeholder="Ej: María García">
    </div>

    <div class="form-group">
      <label for="de-input">De (Remitente):</label>
      <input type="text" id="de-input" placeholder="Ej: Carlos Romero">
    </div>

    <div class="form-group">
      <label for="phone-input">Tu Número de Teléfono / WhatsApp (Remitente):</label>
      <input type="tel" id="phone-input" placeholder="Ej: +56912345678">
    </div>

    <div class="form-group">
      <label for="msg-input">Mensaje de la Carta:</label>
      <textarea id="msg-input" placeholder="Escribe tu mensaje especial aquí...&#10;Ej: ¿Quieres salir conmigo a compartir un momento especial? ✨💖"></textarea>
    </div>

    <div class="form-group">
      <label for="resp-input">Mensaje de Aceptación (Al decir Sí):</label>
      <textarea id="resp-input" placeholder="Mensaje que verá al aceptar (Opcional)&#10;Ej: ¡Sabía que dirías que sí! Ya estoy preparando todo. 🥰✨"></textarea>
    </div>

    <button class="btn" id="btn-generate">Generar Enlace Corto</button>

    <div class="results" id="results-section">
      <div class="result-title">Enlace Corto (Recomendado):</div>
      <div class="link-container">
        <input type="text" class="link-input" id="short-link" readonly>
        <button class="btn-copy" id="btn-copy-short">Copiar</button>
      </div>

      <div class="result-title">Enlace de Respaldo (Base64 completo):</div>
      <div class="link-container">
        <input type="text" class="link-input" id="base64-link" readonly>
        <button class="btn-copy" id="btn-copy-base64">Copiar</button>
      </div>

      <div class="actions-grid">
        <button class="btn btn-secondary" id="btn-test" style="margin-top:0;">Probar Enlace ↗</button>
        <button class="btn btn-secondary" id="btn-restart" style="margin-top:0;">Crear Otra</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">¡Enlace copiado al portapapeles! 💖</div>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-client.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnGenerate = document.getElementById('btn-generate');
      const resultsSection = document.getElementById('results-section');
      const shortLinkInput = document.getElementById('short-link');
      const base64LinkInput = document.getElementById('base64-link');
      
      const paraInput = document.getElementById('para-input');
      const deInput = document.getElementById('de-input');
      const phoneInput = document.getElementById('phone-input');
      const msgInput = document.getElementById('msg-input');
      const respInput = document.getElementById('resp-input');
      
      const btnCopyShort = document.getElementById('btn-copy-short');
      const btnCopyBase64 = document.getElementById('btn-copy-base64');
      const btnTest = document.getElementById('btn-test');
      const btnRestart = document.getElementById('btn-restart');
      const toast = document.getElementById('toast');

      let currentLink = '';

      btnGenerate.addEventListener('click', async () => {
        const para = paraInput.value.trim();
        const de = deInput.value.trim();
        const phone = phoneInput.value.trim();
        const msg = msgInput.value.trim();
        const resp = respInput.value.trim() || '¡Sabía que dirías que sí! Todo está listo para nuestro momento especial. 🥰✨';

        if (!para || !de || !msg) {
          alert('Por favor, completa los campos de Destinatario, Remitente y Mensaje.');
          return;
        }

        btnGenerate.textContent = 'Guardando carta...';
        btnGenerate.disabled = true;

        const baseURI = window.location.href.split('/').slice(0, -1).join('/') + '/';

        // 1. Crear respaldo local Base64 URL-safe
        const combined = `${para}|${de}|${msg}|${resp}|${phone}`;
        const utf8Bytes = encodeURIComponent(combined);
        const base64 = window.btoa(unescape(utf8Bytes))
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/, '');
        const backupUrl = `${baseURI}index.html?c=${base64}`;
        base64LinkInput.value = backupUrl;

        // 2. Si Supabase está configurado, guardar en la Base de Datos
        if (window.SupabaseLetterDB && window.SupabaseLetterDB.isConfigured()) {
          try {
            const letter = await window.SupabaseLetterDB.createLetter({
              recipient_name: para,
              sender_name: de,
              sender_phone: phone,
              message: msg,
              acceptance_message: resp
            });

            const dbUrl = `${baseURI}index.html?l=${letter.short_code}`;
            shortLinkInput.value = dbUrl;
            currentLink = dbUrl;
          } catch (err) {
            console.error('Error al guardar en Supabase:', err);
            alert('Aviso: Ocurrió un detalle al conectar con Supabase. Usando enlace de respaldo.');
            shortLinkInput.value = backupUrl;
            currentLink = backupUrl;
          }
        } else {
          // Si Supabase aún no tiene credenciales, intentar acortador o enlace Base64
          try {
            const response = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(backupUrl)}`, {
              mode: 'cors'
            });
            if (response.ok) {
              const data = await response.json();
              if (data.shorturl) {
                shortLinkInput.value = data.shorturl;
                currentLink = data.shorturl;
              } else {
                throw new Error('No shorturl');
              }
            } else {
              throw new Error('Network error');
            }
          } catch (err) {
            shortLinkInput.value = backupUrl;
            currentLink = backupUrl;
          }
        }

        btnGenerate.textContent = 'Generar Enlace Corto';
        btnGenerate.disabled = false;
        resultsSection.classList.add('active');
        btnGenerate.style.display = 'none';
      });

      // Copy mechanisms
      const showToast = () => {
        toast.classList.add('active');
        setTimeout(() => {
          toast.classList.remove('active');
        }, 2500);
      };

      const copyToClipboard = async (inputEl) => {
        try {
          await navigator.clipboard.writeText(inputEl.value);
          showToast();
        } catch (err) {
          inputEl.select();
          document.execCommand('copy');
          showToast();
        }
      };

      btnCopyShort.addEventListener('click', () => copyToClipboard(shortLinkInput));
      btnCopyBase64.addEventListener('click', () => copyToClipboard(base64LinkInput));

      btnTest.addEventListener('click', () => {
        window.open(currentLink, '_blank');
      });

      btnRestart.addEventListener('click', () => {
        resultsSection.classList.remove('active');
        btnGenerate.style.display = 'block';
        paraInput.value = '';
        deInput.value = '';
        phoneInput.value = '';
        msgInput.value = '';
        respInput.value = '';
      });
    });
  </script>
</body>
</html>
